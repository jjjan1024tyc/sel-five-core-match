<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEL 五大核心配對</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #d7dce6;
    --accent: #3b6ef5;
    --ok: #16a34a;
    --bad: #dc2626;
    --star: #f5b301;
    --c1: #e85d75; --c1s: #fde8ec;
    --c2: #f08a24; --c2s: #fef0e1;
    --c3: #2f9e6e; --c3s: #e3f5ec;
    --c4: #3b6ef5; --c4s: #e6edfe;
    --c5: #8b5cf6; --c5s: #efe9fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    font-size: 18.7px; line-height: 1.6;
  }
  header { padding: 16px 16px 4px; text-align: center; }
  h1 { margin: 0; font-size: 30.8px; }
  .sub { color: var(--muted); font-size: 17.6px; margin-top: 2px; }

  .layout {
    max-width: 1400px; margin: 14px auto 30px; padding: 0 16px;
    display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: start;
  }

  /* 左側關卡 */
  aside { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .asidehead { font-size: 16.5px; color: var(--muted); font-weight: 700; }
  .lvl {
    border: 2px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 14px; padding: 10px 8px; cursor: pointer; font: inherit;
    font-size: 19.8px; font-weight: 700; display: flex; flex-direction: column;
    align-items: center; gap: 0; transition: transform .1s, border-color .15s;
  }
  .lvl:hover { transform: translateX(3px); }
  .lvl.active { border-color: var(--accent); box-shadow: 0 0 0 3px #3b6ef533; }
  .lvl.done { background: #e9f9ef; border-color: var(--ok); }
  .lvl.done.active { border-color: var(--accent); }
  .lvl .st { font-size: 15.4px; font-weight: 600; color: var(--muted); }
  .lvl.done .st { color: var(--ok); }
  .lvl .stars { color: var(--star); letter-spacing: 2px; font-size: 15.4px; }
  .btn {
    font: inherit; font-size: 17.6px; font-weight: 700; padding: 9px 12px;
    border-radius: 10px; border: 2px solid var(--line); background: var(--panel);
    color: var(--ink); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 上方核心能力（放置區） */
  .slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .slot {
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .slot .name {
    font-size: 22px; font-weight: 800; text-align: center; color: #fff;
    background: var(--c); border-radius: 10px; padding: 6px 4px; line-height: 1.3;
  }
  .slot .drop {
    flex: 1; min-height: 110px; border: 2px dashed var(--line); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #a3aab8; font-size: 16.5px; text-align: center; padding: 6px;
  }
  .slot.hover { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 30%, transparent); }
  .slot.hover .drop { border-color: var(--c); background: var(--cs); color: var(--c); }
  .slot.filled { cursor: default; border-color: var(--c); background: var(--cs); }
  .slot.filled .drop { border: none; padding: 0; display: block; }
  .slot.wrong { border-color: var(--bad); animation: shake .4s; }

  .info { margin: 16px 0 10px; font-size: 18.7px; color: var(--muted); }
  .info b { color: var(--ink); }

  /* 下方選項 */
  .pool { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: start; min-height: 60px; }
  .card {
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    padding: 12px 14px; cursor: grab; user-select: none; -webkit-user-select: none;
    color: var(--ink); text-align: left; font-size: 18.7px;
    touch-action: none; transition: border-color .15s, box-shadow .15s, transform .1s;
    box-shadow: 0 2px 0 #0000000d;
  }
  .card:hover { border-color: #9fb3e8; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 4px #3b6ef544; transform: translateY(-3px); }
  .card.ghost { opacity: .3; }
  .card.wrong { border-color: var(--bad); animation: shake .4s; }
  .card.matched {
    cursor: default; touch-action: auto; background: var(--panel);
    border-color: var(--c); box-shadow: none; padding: 10px 12px;
  }
  .card .label { font-weight: 800; color: var(--c); }
  .card.big { font-size: 22px; font-weight: 700; text-align: center; }
  .drag {
    position: fixed; z-index: 50; pointer-events: none; margin: 0;
    box-shadow: 0 12px 30px #0003; transform: rotate(2deg); cursor: grabbing;
    border-color: var(--accent);
  }
  .pool .done-msg { grid-column: 1 / -1; text-align: center; color: var(--ok); font-weight: 700; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  .pop { animation: pop .35s; }
  @keyframes pop { 50% { transform: scale(1.05); } }

  .overlay {
    position: fixed; inset: 0; background: #0f172a99; display: none;
    align-items: center; justify-content: center; z-index: 60; padding: 16px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel); border-radius: 20px; padding: 28px 30px; text-align: center;
    max-width: 440px; width: 100%; box-shadow: 0 20px 50px #0005; animation: pop .4s;
  }
  .modal h2 { margin: 0 0 6px; font-size: 33px; }
  .modal .big { font-size: 50.6px; color: var(--star); letter-spacing: 6px; margin: 6px 0; }
  .modal .big .off { color: #d9dde5; }
  .modal p { margin: 6px 0 18px; color: var(--muted); }
  .modal .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }

  .linkbtn { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: 14.3px; padding: 0; }

  /* 平板 */
  @media (max-width: 1024px) {
    body { font-size: 17.6px; }
    .layout { grid-template-columns: 112px 1fr; gap: 12px; }
    .lvl { font-size: 16.5px; padding: 8px 4px; }
    .slots { gap: 6px; }
    .slot { padding: 6px; }
    .slot .name { font-size: 16.5px; }
    .slot .drop { min-height: 90px; font-size: 14.3px; }
    .pool { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .card { font-size: 17.6px; }
    .card.matched { padding: 6px 8px; font-size: 15.4px; }
  }
  /* 手機 */
  @media (max-width: 600px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; flex-direction: row; flex-wrap: wrap; }
    aside .lvl { flex: 1 1 30%; }
    .asidehead { width: 100%; }
    .slots { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>認識 SEL 五大核心｜配對挑戰</h1>
  <div class="sub">把下方的卡片拖到上方對應的核心能力；也可以先點卡片、再點能力</div>
</header>

<div class="layout">
  <aside>
    <div class="asidehead">關卡</div>
    <div id="levels" style="display:contents"></div>
    <button class="btn" id="replay">↻ 重玩本關</button>
    <button class="linkbtn" id="resetAll">清除所有過關紀錄</button>
  </aside>

  <main>
    <div class="slots" id="slots"></div>
    <div class="info" id="info"></div>
    <div class="pool" id="pool"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="mTitle">過關！</h2>
    <div class="big" id="mStars"></div>
    <p id="mText"></p>
    <div class="row" id="mBtns"></div>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
const ABILITIES = [
  { name: "自我覺察", color: 1 },
  { name: "自我管理", color: 2 },
  { name: "社會覺察", color: 3 },
  { name: "人際技巧", color: 4 },
  { name: "負責任的決策", color: 5 },
];
const LEVELS = [
  { title: "一句話口訣", items: ["我懂我自己", "我管得住自己", "我懂別人的感受", "我會跟人合作溝通", "我為選擇負責"] },
  { title: "關鍵動作", items: ["辨識情緒、認識優缺點", "情緒煞車、抗壓自律", "換位思考、尊重差異", "好好說話、化解衝突", "評估後果、做對的事"] },
  { title: "白話定義", items: [
    "像幫大腦裝上「情緒雷達」，能精準叫出自己現在的情緒名字，知道自己為什麼生氣或難過，也清楚自己的優缺點與底線。",
    "情緒來了沒關係，重點是你能踩煞車、轉方向盤。包含控制衝動、排解壓力，以及為了達成目標而自律。",
    "「同理心」與「讀空氣」的能力。能站在別人的角度想事情，理解每個人的家庭背景、個性與文化都不同，懂得尊重差異。",
    "懂得如何清楚表達自己的想法、專心聽別人說話、跟隊友分工合作，以及在吵架時好好溝通、不冷戰也不霸凌。",
    "做任何選擇前，先在腦中模擬「這樣做會發生什麼事？對自己和別人安全嗎？符合道德與校規嗎？」，並且願意為自己的選擇負責。",
  ] },
  { title: "日常情境1", items: [
    "分辨情緒： 段考數學考砸時，你不會只覺得「好煩、想摔筆」，而是能察覺：「我現在其實不是生老師的氣，我是對自己粗心感到懊惱，還有點害怕回家被唸。」",
    "情緒降溫： 在班群或 IG 看到有人發限動暗酸自己，氣到想立刻留言開戰時，先放下手機深呼吸 10 秒、去喝口水，等冷靜後再決定怎麼處理，不讓一時衝動留下黑歷史。",
    "換位思考： 平常愛開玩笑的同學今天突然趴在桌上不說話，你不會硬去鬧他，而是察覺他可能心情低落或遇到困難，給予安靜的空間或低調關心。",
    "有效溝通（我訊息）： 合作做報告時，組員一直滑手機不做事，你不是罵他「你很廢、都你在擺爛」，而是說：「我覺得有點著急，因為明天就要交了，我希望我們現在一起把最後兩頁做完。」",
    "網路行為評估： 收到同學傳來的搞笑醜照或八卦截圖，在按下「轉發」前先想一下：「如果主角是我，我會怎麼想？這會不會變成網路霸凌？」，最後決定不轉傳並提醒朋友。",
  ] },
  { title: "日常情境2", items: [
    "認識優劣勢： 資訊課分組做專題時，你知道自己「程式邏輯強，但上台報告會緊張」，因此能主動提出負責寫程式的部分。",
    "自律與抗壓： 距離會考或大隊接力比賽還有一個月，雖然很想打手遊，但能幫自己排定每天 30 分鐘的複習或體能練習計畫並確實做到。",
    "尊重差異： 班上有轉學生、特殊生，或習慣與大家不同的同學時，不會跟著起鬨嘲笑，而是理解每個人都有自己的步調。",
    "拒絕同儕壓力： 朋友起鬨要一起翹課或抽電子煙時，你能堅定且不傷和氣地拒絕：「這我不行，但我等下放學可以陪你們去打球。」",
    "誠實面對錯誤： 不小心打破教室的玻璃或弄壞公用器材，雖然很怕被罵，但評估隱瞞會造成別人受傷或更嚴重的誤會，決定主動向老師報告並討論賠償或善後方式。",
  ] },
];
const STORE_KEY = "sel5-match-progress-v1";

// 拆出情境前面的小標題（例：「分辨情緒：」），遊戲中先隱藏
function splitLabel(text) {
  const m = text.match(/^([^：「」]{2,14})：\s*(.*)$/s);
  return m ? { label: m[1], body: m[2] } : { label: "", body: text };
}
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function starsFor(mistakes) { return mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1; }
function starText(n) { return "★".repeat(n) + "☆".repeat(3 - n); }
function setColor(el, ab) {
  el.style.setProperty("--c", `var(--c${ab.color})`);
  el.style.setProperty("--cs", `var(--c${ab.color}s)`);
}

let progress = loadProgress();     // { "0": 3, ... } 每關最佳星等
let current = 0;
let state;                          // { matched:Set, mistakes, selCard }

const $ = (id) => document.getElementById(id);

function renderLevels() {
  const box = $("levels");
  box.innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const b = document.createElement("button");
    const best = progress[i];
    b.className = "lvl" + (i === current ? " active" : "") + (best ? " done" : "");
    b.innerHTML = `<span>${lv.title}</span>` +
      (best ? `<span class="st">✅ 過關</span><span class="stars">${starText(best)}</span>`
            : `<span class="st">第 ${i + 1} 關</span>`);
    b.onclick = () => startLevel(i);
    box.appendChild(b);
  });
}

function renderInfo() {
  $("info").innerHTML = `第 ${current + 1} 關：<b>${LEVELS[current].title}</b>｜已配對 <b>${state.matched.size}</b> / 5｜錯誤 <b>${state.mistakes}</b> 次`;
}

function startLevel(i) {
  current = i;
  state = { matched: new Set(), mistakes: 0, selCard: null };
  const lv = LEVELS[i];
  const isScenario = lv.title.startsWith("日常情境");
  const isShort = i <= 1;

  const slots = $("slots"), pool = $("pool");
  slots.innerHTML = "";
  pool.innerHTML = "";

  ABILITIES.forEach((ab, idx) => {
    const s = document.createElement("div");
    s.className = "slot";
    s.dataset.idx = idx;
    setColor(s, ab);
    s.innerHTML = `<div class="name">${ab.name}</div><div class="drop">拖到這裡</div>`;
    s.onclick = () => { if (state.selCard) tryMatch(state.selCard, s); };
    slots.appendChild(s);
  });

  shuffle(lv.items.map((t, idx) => ({ t, idx }))).forEach(({ t, idx }) => {
    const c = document.createElement("div");
    c.className = "card" + (isShort ? " big" : "");
    c.dataset.idx = idx;
    const parts = isScenario ? splitLabel(t) : { label: "", body: t };
    c.dataset.label = parts.label;
    c.innerHTML = `<div class="body">${parts.body}</div>`;
    c.addEventListener("pointerdown", onPointerDown);
    // 每張卡放在固定格位裡，拖走後格位留著，其他卡不會往左靠齊
    const spot = document.createElement("div");
    spot.className = "spot";
    spot.appendChild(c);
    pool.appendChild(spot);
  });

  renderLevels();
  renderInfo();
}

/* ---------- 點選 ---------- */
function selectCard(c) {
  if (state.selCard === c) { c.classList.remove("sel"); state.selCard = null; return; }
  if (state.selCard) state.selCard.classList.remove("sel");
  state.selCard = c;
  c.classList.add("sel");
}

/* ---------- 拖曳（Pointer Events：滑鼠、觸控都可用） ---------- */
let drag = null;

function onPointerDown(e) {
  const c = e.currentTarget;
  if (c.classList.contains("matched") || e.button > 0) return;
  e.preventDefault();
  const r = c.getBoundingClientRect();
  drag = { card: c, startX: e.clientX, startY: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top,
           w: r.width, clone: null, over: null, id: e.pointerId };
  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", onPointerUp);
  document.addEventListener("pointercancel", onPointerUp);
}

function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.clone) {
    if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 8) return;
    const cl = drag.card.cloneNode(true);
    cl.classList.remove("sel");
    cl.classList.add("drag");
    cl.style.width = drag.w + "px";
    document.body.appendChild(cl);
    drag.clone = cl;
    drag.card.classList.add("ghost");
    if (state.selCard) { state.selCard.classList.remove("sel"); state.selCard = null; }
  }
  drag.clone.style.left = (e.clientX - drag.dx) + "px";
  drag.clone.style.top = (e.clientY - drag.dy) + "px";

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const slot = el && el.closest(".slot:not(.filled)");
  if (slot !== drag.over) {
    if (drag.over) drag.over.classList.remove("hover");
    if (slot) slot.classList.add("hover");
    drag.over = slot;
  }
  autoScroll(e.clientY);
}

function autoScroll(y) {
  const edge = 70;
  if (y < edge) window.scrollBy(0, -12);
  else if (y > innerHeight - edge) window.scrollBy(0, 12);
}

function onPointerUp(e) {
  if (!drag || e.pointerId !== drag.id) return;
  document.removeEventListener("pointermove", onPointerMove);
  document.removeEventListener("pointerup", onPointerUp);
  document.removeEventListener("pointercancel", onPointerUp);
  const d = drag;
  drag = null;
  if (!d.clone) { selectCard(d.card); return; }   // 沒拖動 → 當作點選
  d.clone.remove();
  d.card.classList.remove("ghost");
  if (d.over) { d.over.classList.remove("hover"); tryMatch(d.card, d.over); }
}

/* ---------- 判斷配對 ---------- */
function tryMatch(card, slot) {
  if (slot.classList.contains("filled")) return;
  card.classList.remove("sel");
  state.selCard = null;
  if (card.dataset.idx === slot.dataset.idx) {
    const ab = ABILITIES[+slot.dataset.idx];
    setColor(card, ab);
    card.classList.remove("big");
    card.classList.add("matched");
    const label = card.dataset.label;
    if (label) card.querySelector(".body").insertAdjacentHTML("afterbegin", `<span class="label">${label}：</span>`);
    const drop = slot.querySelector(".drop");
    drop.textContent = "";
    drop.appendChild(card);
    slot.classList.add("filled");
    flash(slot, "pop");
    state.matched.add(+slot.dataset.idx);
    renderInfo();
    if (state.matched.size === 5) {
      $("pool").insertAdjacentHTML("beforeend", `<div class="done-msg">全部配對完成！</div>`);
      setTimeout(levelComplete, 450);
    }
  } else {
    state.mistakes++;
    flash(card, "wrong");
    flash(slot, "wrong");
    renderInfo();
  }
}

function flash(n, cls) {
  n.classList.remove(cls);
  void n.offsetWidth;
  n.classList.add(cls);
  setTimeout(() => n.classList.remove(cls), 450);
}

/* ---------- 過關 ---------- */
function levelComplete() {
  const s = starsFor(state.mistakes);
  const wasAllDone = LEVELS.every((_, i) => progress[i]);
  progress[current] = Math.max(progress[current] || 0, s);
  saveProgress(progress);
  renderLevels();

  const allDone = LEVELS.every((_, i) => progress[i]);
  const next = LEVELS.findIndex((_, i) => !progress[i]);
  const btns = [`<button class="btn" data-act="replay">↻ 重玩本關</button>`];

  if (allDone && !wasAllDone) {
    $("mTitle").textContent = "🎉 全部過關！";
    $("mText").innerHTML = `你已完成 SEL 五大核心全部 5 關！<br>總星數：<b>${totalStars()}</b> / 15`;
    btns.push(`<button class="btn primary" data-act="close">太棒了</button>`);
    confetti(4500);
  } else {
    $("mTitle").textContent = "過關！";
    $("mText").innerHTML = `「${LEVELS[current].title}」錯誤 ${state.mistakes} 次` +
      (s < 3 ? "<br>零失誤可以拿到三顆星喔！" : "<br>零失誤，完美！");
    if (next >= 0) btns.push(`<button class="btn primary" data-act="go" data-i="${next}">下一關：${LEVELS[next].title} →</button>`);
    else btns.push(`<button class="btn primary" data-act="close">好</button>`);
    confetti(1800);
  }
  $("mStars").innerHTML = "★".repeat(s) + `<span class="off">${"★".repeat(3 - s)}</span>`;
  $("mBtns").innerHTML = btns.join("");
  $("overlay").classList.add("show");
}

function totalStars() { return LEVELS.reduce((a, _, i) => a + (progress[i] || 0), 0); }

$("mBtns").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  $("overlay").classList.remove("show");
  if (b.dataset.act === "replay") startLevel(current);
  if (b.dataset.act === "go") startLevel(+b.dataset.i);
});
$("replay").onclick = () => startLevel(current);
$("resetAll").onclick = () => {
  if (!confirm("確定要清除所有過關紀錄嗎？")) return;
  progress = {};
  saveProgress(progress);
  startLevel(0);
};

// 簡易彩帶特效
function confetti(ms) {
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const colors = ["#e85d75", "#f08a24", "#2f9e6e", "#3b6ef5", "#8b5cf6", "#f5b301"];
  const ps = Array.from({ length: 160 }, () => ({
    x: Math.random() * W, y: -20 - Math.random() * H * 0.5,
    vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
    c: colors[Math.floor(Math.random() * colors.length)],
  }));
  const end = performance.now() + ms;
  (function tick(t) {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 20 && t < end) { p.y = -20; p.x = Math.random() * W; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (t < end || ps.some(p => p.y < H + 20)) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, W, H);
  })(performance.now());
}

startLevel(Math.max(0, LEVELS.findIndex((_, i) => !progress[i])));
</script>
